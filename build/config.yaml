output_dir: public

directories:
  - assets/css
  - assets/img
  - assets/img/maps
  - assets/img/shoes
  - assets/img/favicons
  - posts
  - pages
  - scripts

app:
  - src: src/index.php
    dest: index.php

assets:
  - src: src/assets/css/stylesheet.css
    dest: assets/css/stylesheet.css
  - src: src/assets/css/skeleton.css
    dest: assets/css/skeleton.css
  - src: src/assets/img/favicons/favicon-16x16.png
    dest: assets/img/favicons/favicon-16x16.png
  - src: src/assets/img/favicons/favicon-32x32.png
    dest: assets/img/favicons/favicon-32x32.png
  - src: src/assets/img/favicons/favicon-96x96.png
    dest: assets/img/favicons/favicon-96x96.png
  - src: src/assets/img/hero.webp
    dest: assets/img/hero.webp
  - src: src/assets/img/openbsd-logo.svg
    dest: assets/img/openbsd-logo.svg
  - src: src/assets/img/php-logo.svg
    dest: assets/img/php-logo.svg
  - src: content/pages/src/maps/china.png
    dest: assets/img/maps/china.png
  - src: content/pages/src/maps/mexico.png
    dest: assets/img/maps/mexico.png
  - src: content/pages/src/maps/nyc.png
    dest: assets/img/maps/nyc.png
  - src: content/pages/src/maps/sanfrancisco.png
    dest: assets/img/maps/sanfrancisco.png
  - src: content/pages/src/maps/seattle.png
    dest: assets/img/maps/seattle.png
  - src: content/pages/src/maps/taipei.png
    dest: assets/img/maps/taipei.png
  - src: content/pages/src/maps/ireland.png
    dest: assets/img/maps/ireland.png
  - src: content/pages/src/shoes/columbia.png
    dest: assets/img/shoes/columbia.png
  - src: content/pages/src/shoes/altra.png
    dest: assets/img/shoes/altra.png
  - src: src/assets/img/mm.jpg
    dest: assets/img/mm.jpg

files:
  - src: src/files/robots.txt
    dest: robots.txt

pages:
  - src: content/pages/about.md 
    dest: pages/index.html
    title: About
    template: page.html.twig
  - src: content/pages/now.md
    dest: pages/now.html
    title: Now
    template: page.html.twig
  - src: content/pages/maps.md
    dest: pages/maps.html
    title: Maps
    template: page.html.twig
  - src: content/pages/shoes.md
    dest: pages/shoes.html
    title: Shoes
    template: page.html.twig
  - src: content/pages/colophon.md 
    dest: pages/colophon.html
    title: Colophon
    template: colophon.html.twig
  - src: content/pages/contact.md
    dest: pages/contact.html
    title: Contact
    template: page.html.twig
  - src: content/pages/ai.md
    dest: pages/ai.html
    title: AI
    template: page.html.twig
  - src: content/pages/error.md
    dest: pages/error.html
    title: Error
    template: page.html.twig
  - src: content/pages/quotes.md
    dest: pages/quotes.html
    title: Quotes
    template: page.html.twig

posts: content/posts

post_index:
  src: src/pages/posts.html
  dest: posts
  title: Posts
  template: posts.html.twig